<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>CYBER</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #05070a;
    font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
    overflow: hidden;
  }
  #app {
    height: 100dvh; width: 100vw;
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
    background: radial-gradient(circle at 50% 20%, rgba(0,225,255,0.10), transparent 60%), #05070a;
  }
  header { text-align: center; padding-top: 24px; }
  header h1 {
    margin: 0; font-size: 15px; letter-spacing: 6px; font-weight: 600;
    color: #00e1ff; text-shadow: 0 0 18px rgba(0,225,255,0.6);
  }
  #status { margin-top: 6px; font-size: 12px; color: #6ee3f5aa; letter-spacing: 1px; min-height: 16px; }
  main { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
  .orb-wrap { position: relative; width: 210px; height: 210px; display: flex; align-items: center; justify-content: center; }
  .ring { position: absolute; border-radius: 50%; border: 1px solid rgba(0,225,255,0.25); }
  .ring1 { width: 210px; height: 210px; }
  .ring2 { width: 170px; height: 170px; border-color: rgba(0,225,255,0.4); }
  #orb {
    width: 130px; height: 130px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #6ff4ff, #00b7d6 55%, #003a45 100%);
    box-shadow: 0 0 30px rgba(0, 225, 255, 0.55), inset 0 0 25px rgba(255,255,255,0.25);
    transition: transform 0.15s ease, box-shadow 0.2s ease;
  }
  #orb.listening { animation: pulse 1.1s ease-in-out infinite; }
  #orb.speaking { animation: speak 0.5s ease-in-out infinite alternate; box-shadow: 0 0 55px rgba(0,255,200,0.85), inset 0 0 25px rgba(255,255,255,0.4); }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  @keyframes speak { from { transform: scale(1); } to { transform: scale(1.14); } }
  #transcript { min-height: 54px; max-width: 340px; text-align: center; color: #d8f9ff; font-size: 15px; line-height: 1.4; padding: 0 12px; }
  footer { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; padding-bottom: 10px; }
  #talkBtn {
    width: 96px; height: 96px; border-radius: 50%;
    border: 2px solid #00e1ff; background: rgba(0,225,255,0.08); color: #00e1ff;
    font-size: 13px; letter-spacing: 2px; display: flex; align-items: center; justify-content: center;
    user-select: none;
  }
  #talkBtn.active { background: #00e1ff; color: #05070a; box-shadow: 0 0 30px rgba(0,225,255,0.7); }
  #talkBtn:disabled { opacity: 0.4; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>CYBER</h1>
    <div id="status">tap and hold to talk</div>
  </header>

  <main>
    <div class="orb-wrap">
      <div class="ring ring1"></div>
      <div class="ring ring2"></div>
      <div id="orb"></div>
    </div>
    <div id="transcript">Hold the button, speak, then release.</div>
  </main>

  <footer>
    <button id="talkBtn">HOLD<br/>TO TALK</button>
  </footer>
</div>

<script>
const statusEl = document.getElementById("status");
const transcriptEl = document.getElementById("transcript");
const orb = document.getElementById("orb");
const talkBtn = document.getElementById("talkBtn");

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

let recognition = null;
let conversation = [];
let isListening = false;
let isSpeaking = false;

if (!SpeechRecognition) {
  statusEl.textContent = "speech recognition not supported in this browser";
  talkBtn.disabled = true;
} else {
  recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    isListening = true;
    orb.classList.add("listening");
    statusEl.textContent = "listening...";
  };

  recognition.onresult = (event) => {
    const heard = event.results[0][0].transcript;
    transcriptEl.textContent = "You: " + heard;
    sendToCyber(heard);
  };

  recognition.onerror = (event) => {
    console.error("Speech recognition error:", event.error);
    statusEl.textContent = "mic error: " + event.error;
    orb.classList.remove("listening");
    isListening = false;
  };

  recognition.onend = () => {
    orb.classList.remove("listening");
    isListening = false;
    if (!isSpeaking) statusEl.textContent = "tap and hold to talk";
  };
}

async function sendToCyber(text) {
  statusEl.textContent = "thinking...";
  conversation.push({ role: "user", content: text });

  try {
    const response = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: conversation.slice(-10) }),
    });

    const data = await response.json();

    if (!response.ok) {
      statusEl.textContent = "error: " + (data.error || "request failed");
      return;
    }

    conversation.push({ role: "assistant", content: data.reply });
    transcriptEl.textContent = "Cyber: " + data.reply;
    speak(data.reply);

  } catch (error) {
    console.error("Chat error:", error);
    statusEl.textContent = "connection error";
  }
}

function speak(text) {
  if (!("speechSynthesis" in window)) {
    statusEl.textContent = "speech synthesis not supported";
    return;
  }

  isSpeaking = true;
  orb.classList.add("speaking");
  statusEl.textContent = "speaking...";

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = 1.05;
  utterance.pitch = 1.0;

  utterance.onend = () => {
    isSpeaking = false;
    orb.classList.remove("speaking");
    statusEl.textContent = "tap and hold to talk";
  };

  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utterance);
}

function startListening() {
  if (!recognition || isListening || isSpeaking) return;
  window.speechSynthesis.cancel();
  try {
    recognition.start();
  } catch (e) {
    // already started, ignore
  }
}

function stopListening() {
  if (recognition && isListening) {
    recognition.stop();
  }
}

talkBtn.addEventListener("touchstart", (e) => {
  e.preventDefault();
  talkBtn.classList.add("active");
  startListening();
});

talkBtn.addEventListener("touchend", (e) => {
  e.preventDefault();
  talkBtn.classList.remove("active");
  stopListening();
});

// Desktop testing support
talkBtn.addEventListener("mousedown", startListening);
talkBtn.addEventListener("mouseup", stopListening);
</script>
</body>
</html>
