<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>CYBER</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #05070a;
    font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
    overflow: hidden;
  }
  #app {
    position: relative; height: 100dvh; width: 100vw;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
    background: radial-gradient(circle at 50% 20%, rgba(0,225,255,0.10), transparent 60%), #05070a;
  }
  video#camFeed { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.30; z-index: 0; }
  .scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,7,10,0.85) 0%, rgba(5,7,10,0.55) 40%, rgba(5,7,10,0.9) 100%); z-index: 1; }
  header { z-index: 2; text-align: center; padding-top: 24px; }
  header h1 { margin: 0; font-size: 15px; letter-spacing: 6px; font-weight: 600; color: #00e1ff; text-shadow: 0 0 18px rgba(0,225,255,0.6); }
  #status { margin-top: 6px; font-size: 12px; color: #6ee3f5aa; letter-spacing: 1px; min-height: 16px; }
  main { z-index: 2; flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
  .orb-wrap { position: relative; width: 200px; height: 200px; display: flex; align-items: center; justify-content: center; }
  .ring { position: absolute; border-radius: 50%; border: 1px solid rgba(0,225,255,0.25); }
  .ring1 { width: 200px; height: 200px; }
  .ring2 { width: 162px; height: 162px; border-color: rgba(0,225,255,0.4); }
  #orb {
    width: 124px; height: 124px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #6ff4ff, #00b7d6 55%, #003a45 100%);
    box-shadow: 0 0 30px rgba(0,225,255,0.55), inset 0 0 25px rgba(255,255,255,0.25);
    transition: transform 0.15s ease, box-shadow 0.2s ease;
  }
  #orb.listening { animation: pulse 1.1s ease-in-out infinite; }
  #orb.speaking { animation: speak 0.5s ease-in-out infinite alternate; box-shadow: 0 0 55px rgba(0,255,200,0.85), inset 0 0 25px rgba(255,255,255,0.4); }
  #orb.thinking { animation: pulse 0.6s ease-in-out infinite; box-shadow: 0 0 40px rgba(255,180,0,0.6); }
  #orb.idle { opacity: 0.6; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  @keyframes speak { from { transform: scale(1); } to { transform: scale(1.14); } }
  #transcript { z-index: 2; min-height: 50px; max-width: 340px; text-align: center; color: #d8f9ff; font-size: 14px; line-height: 1.4; padding: 0 12px; }
  #nowPlaying { z-index: 2; font-size: 12px; color: #00ffc8aa; min-height: 16px; letter-spacing: 0.5px; }
  footer { z-index: 2; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; padding-bottom: 10px; }
  #startBtn {
    background: transparent; border: 1px solid rgba(0,225,255,0.4); color: #6ee3f5;
    padding: 12px 28px; border-radius: 999px; font-size: 13px; letter-spacing: 1px;
  }
  #startBtn.active { border-color: #00ffc8; color: #00ffc8; }
  .row { display: flex; gap: 12px; }
  .iconBtn {
    width: 46px; height: 46px; border-radius: 50%;
    border: 1px solid rgba(0,225,255,0.3); background: rgba(255,255,255,0.03);
    color: #6ee3f5; font-size: 18px; display: flex; align-items: center; justify-content: center;
  }
  .iconBtn.on { background: rgba(0,225,255,0.2); color: #fff; }
</style>
</head>
<body>
<div id="app">
  <video id="camFeed" autoplay playsinline muted></video>
  <div class="scrim"></div>

  <header>
    <h1>CYBER</h1>
    <div id="status">tap start to begin</div>
  </header>

  <main>
    <div class="orb-wrap">
      <div class="ring ring1"></div>
      <div class="ring ring2"></div>
      <div id="orb" class="idle"></div>
    </div>
    <div id="transcript">Cyber listens continuously once started. Just speak naturally and finish your sentence.</div>
    <div id="nowPlaying"></div>
  </main>

  <footer>
    <div class="row">
      <button class="iconBtn" id="camToggle" title="Camera">📷</button>
      <button class="iconBtn" id="muteToggle" title="Mute mic">🎤</button>
    </div>
    <button id="startBtn">START</button>
  </footer>
</div>

<audio id="musicPlayer" playsinline></audio>
<canvas id="captureCanvas" style="display:none;"></canvas>

<script>
const statusEl = document.getElementById("status");
const transcriptEl = document.getElementById("transcript");
const nowPlayingEl = document.getElementById("nowPlaying");
const orb = document.getElementById("orb");
const startBtn = document.getElementById("startBtn");
const camToggle = document.getElementById("camToggle");
const muteToggle = document.getElementById("muteToggle");
const camFeed = document.getElementById("camFeed");
const musicPlayer = document.getElementById("musicPlayer");
const captureCanvas = document.getElementById("captureCanvas");

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

let recognition = null;
let conversation = [];
let running = false;
let micMuted = false;
let isSpeaking = false;
let isProcessing = false;
let camOn = false;
let camStream = null;
let musicVolume = 70;
let restartTimer = null;

function setStatus(text) { statusEl.textContent = text; }
function setOrbState(state) {
  orb.classList.remove("listening", "speaking", "thinking", "idle");
  orb.classList.add(state || "idle");
}

// ------------------------------------------------------------
// Continuous listening setup
// ------------------------------------------------------------
if (!SpeechRecognition) {
  setStatus("speech recognition not supported in this browser");
  startBtn.disabled = true;
} else {
  recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.continuous = true;      // keep listening
  recognition.interimResults = true;  // see partial results to know user is still talking
  recognition.maxAlternatives = 1;

  let finalTranscript = "";
  let silenceTimer = null;
  const SILENCE_WAIT_MS = 900; // how long to wait after last speech before treating sentence as done

  recognition.onstart = () => {
    if (!isSpeaking && !isProcessing) {
      setOrbState("listening");
      setStatus("listening...");
    }
  };

  recognition.onresult = (event) => {
    if (isSpeaking || isProcessing || micMuted) return;

    let interim = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcriptPiece = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        finalTranscript += transcriptPiece + " ";
      } else {
        interim += transcriptPiece;
      }
    }

    if (interim || finalTranscript) {
      transcriptEl.textContent = "You: " + (finalTranscript + interim).trim();
    }

    // Reset the "user has stopped talking" timer every time new speech comes in
    clearTimeout(silenceTimer);
    silenceTimer = setTimeout(() => {
      const completeThought = finalTranscript.trim();
      finalTranscript = "";
      if (completeThought) {
        handleUserSpeech(completeThought);
      }
    }, SILENCE_WAIT_MS);
  };

  recognition.onerror = (event) => {
    console.error("Speech recognition error:", event.error);
    if (event.error === "not-allowed" || event.error === "service-not-allowed") {
      setStatus("microphone permission denied");
      running = false;
      startBtn.textContent = "START";
      startBtn.classList.remove("active");
    }
    // no-speech and other transient errors are ignored - onend will restart
  };

  recognition.onend = () => {
    if (running && !isSpeaking && !isProcessing) {
      // Restart immediately to keep continuous listening alive
      // (Safari stops recognition periodically on its own)
      clearTimeout(restartTimer);
      restartTimer = setTimeout(() => {
        try { recognition.start(); } catch (e) {}
      }, 250);
    }
  };
}

// ------------------------------------------------------------
// Start / stop
// ------------------------------------------------------------
startBtn.addEventListener("click", () => {
  if (running) {
    running = false;
    startBtn.textContent = "START";
    startBtn.classList.remove("active");
    setStatus("stopped");
    setOrbState("idle");
    try { recognition.stop(); } catch (e) {}
    window.speechSynthesis.cancel();
  } else {
    running = true;
    startBtn.textContent = "STOP";
    startBtn.classList.add("active");
    setStatus("listening...");
    try { recognition.start(); } catch (e) {}
    speak("Cyber online. I'm listening.");
  }
});

// ------------------------------------------------------------
// Handle a completed user sentence
// ------------------------------------------------------------
async function handleUserSpeech(text) {
  if (!text || isProcessing) return;

  isProcessing = true;
  setOrbState("thinking");
  setStatus("thinking...");

  conversation.push({ role: "user", content: text });

  try {
    const response = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: conversation.slice(-12) }),
    });

    const data = await response.json();

    if (!response.ok) {
      setStatus("error: " + (data.error || "request failed"));
      isProcessing = false;
      setOrbState("idle");
      return;
    }

    if (data.toolCalls && data.toolCalls.length > 0) {
      await handleToolCalls(data.toolCalls);
    } else if (data.reply) {
      conversation.push({ role: "assistant", content: data.reply });
      transcriptEl.textContent = "Cyber: " + data.reply;
      speak(data.reply);
    }

  } catch (error) {
    console.error("Chat error:", error);
    setStatus("connection error");
    isProcessing = false;
    setOrbState("idle");
  }
}

// ------------------------------------------------------------
// Execute tool calls locally, then continue the conversation
// ------------------------------------------------------------
async function handleToolCalls(toolCalls) {
  const assistantToolMsg = {
    role: "assistant",
    content: null,
    tool_calls: toolCalls.map((tc) => ({
      id: tc.id,
      type: "function",
      function: { name: tc.name, arguments: tc.arguments },
    })),
  };
  conversation.push(assistantToolMsg);

  for (const call of toolCalls) {
    let args = {};
    try { args = call.arguments ? JSON.parse(call.arguments) : {}; } catch (e) {}

    let result = {};

    try {
      switch (call.name) {
        case "play_music": result = await playMusic(args.song_name); break;
        case "pause_music":
          musicPlayer.pause();
          result = { success: true, message: "Music paused." };
          break;
        case "stop_music":
          musicPlayer.pause();
          musicPlayer.currentTime = 0;
          nowPlayingEl.textContent = "";
          result = { success: true, message: "Music stopped." };
          break;
        case "set_volume":
          musicVolume = Math.max(0, Math.min(100, args.level ?? 70));
          musicPlayer.volume = musicVolume / 100;
          result = { success: true, message: `Volume set to ${musicVolume}.` };
          break;
        case "analyze_camera": result = await analyzeCamera(); break;
        default: result = { success: false, message: "Unknown function." };
      }
    } catch (error) {
      console.error("Tool execution error:", error);
      result = { success: false, message: "Function failed to execute." };
    }

    conversation.push({
      role: "tool",
      tool_call_id: call.id,
      content: JSON.stringify(result),
    });
  }

  // Get Cyber's spoken follow-up now that it has the results
  try {
    const response = await fetch("/chat/continue", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: conversation.slice(-14) }),
    });

    const data = await response.json();

    if (response.ok && data.reply) {
      conversation.push({ role: "assistant", content: data.reply });
      transcriptEl.textContent = "Cyber: " + data.reply;
      speak(data.reply);
    } else {
      isProcessing = false;
      setOrbState("idle");
    }
  } catch (error) {
    console.error("Continue error:", error);
    isProcessing = false;
    setOrbState("idle");
  }
}

// ------------------------------------------------------------
// Speak Cyber's reply, pause listening while speaking
// ------------------------------------------------------------
function speak(text) {
  if (!("speechSynthesis" in window)) {
    setStatus("speech synthesis not supported");
    isProcessing = false;
    return;
  }

  isSpeaking = true;
  setOrbState("speaking");
  setStatus("speaking...");

  try { recognition.stop(); } catch (e) {}

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = 1.02;
  utterance.pitch = 0.95;

  utterance.onend = () => {
    isSpeaking = false;
    isProcessing = false;
    if (running) {
      setOrbState("listening");
      setStatus("listening...");
      try { recognition.start(); } catch (e) {}
    } else {
      setOrbState("idle");
    }
  };

  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utterance);
}

// ------------------------------------------------------------
// Music
// ------------------------------------------------------------
async function playMusic(songName) {
  try {
    const listResp = await fetch("/music/list");
    const { songs } = await listResp.json();

    if (!songs || songs.length === 0) {
      return { success: false, message: "No songs available in the music library." };
    }

    let chosen = songs[0];
    if (songName) {
      const match = songs.find((s) => s.toLowerCase().includes(songName.toLowerCase()));
      if (match) chosen = match;
    }

    musicPlayer.src = "/music/" + encodeURIComponent(chosen);
    musicPlayer.volume = musicVolume / 100;
    await musicPlayer.play();
    nowPlayingEl.textContent = "♪ " + chosen;

    return { success: true, message: `Now playing ${chosen}.` };
  } catch (error) {
    console.error("Play music error:", error);
    return { success: false, message: "Could not play music." };
  }
}

// ------------------------------------------------------------
// Camera
// ------------------------------------------------------------
async function analyzeCamera() {
  if (!camOn || !camStream) {
    return { success: false, message: "Camera is not currently active." };
  }

  try {
    const track = camStream.getVideoTracks()[0];
    const settings = track.getSettings();

    captureCanvas.width = settings.width || 640;
    captureCanvas.height = settings.height || 480;

    const ctx = captureCanvas.getContext("2d");
    ctx.drawImage(camFeed, 0, 0, captureCanvas.width, captureCanvas.height);

    const base64 = captureCanvas.toDataURL("image/jpeg", 0.7).split(",")[1];

    const response = await fetch("/vision", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: base64 }),
    });

    const data = await response.json();

    if (!response.ok) {
      return { success: false, message: data.error || "Vision analysis failed." };
    }

    return { success: true, description: data.description };
  } catch (error) {
    console.error("Camera analysis error:", error);
    return { success: false, message: "Could not analyze the camera image." };
  }
}

// ------------------------------------------------------------
// UI controls
// ------------------------------------------------------------
muteToggle.addEventListener("click", () => {
  micMuted = !micMuted;
  muteToggle.classList.toggle("on", micMuted);
  muteToggle.textContent = micMuted ? "🔇" : "🎤";
});

camToggle.addEventListener("click", async () => {
  if (camOn) {
    camStream.getTracks().forEach((t) => t.stop());
    camFeed.srcObject = null;
    camOn = false;
    camToggle.classList.remove("on");
    return;
  }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    camFeed.srcObject = camStream;
    camOn = true;
    camToggle.classList.add("on");
  } catch (error) {
    console.error("Camera error:", error);
    setStatus("camera permission denied");
  }
});
</script>
</body>
</html>
