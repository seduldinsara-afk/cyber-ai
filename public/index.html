<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>CYBER</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; background: #05070a; font-family: -apple-system, "SF Pro Display", system-ui, sans-serif; overflow: hidden; }
  #app { position: relative; height: 100dvh; width: 100vw; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom); background: radial-gradient(circle at 50% 20%, rgba(0,225,255,0.10), transparent 60%), #05070a; }
  video#camFeed { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.30; z-index: 0; }
  .scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,7,10,0.85) 0%, rgba(5,7,10,0.55) 40%, rgba(5,7,10,0.9) 100%); z-index: 1; }
  header { z-index: 2; text-align: center; padding-top: 24px; }
  header h1 { margin: 0; font-size: 15px; letter-spacing: 6px; font-weight: 600; color: #00e1ff; text-shadow: 0 0 18px rgba(0,225,255,0.6); }
  #status { margin-top: 6px; font-size: 12px; color: #6ee3f5aa; letter-spacing: 1px; min-height: 16px; }
  main { z-index: 2; flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
  .orb-wrap { position: relative; width: 200px; height: 200px; display: flex; align-items: center; justify-content: center; }
  .ring { position: absolute; border-radius: 50%; border: 1px solid rgba(0,225,255,0.25); }
  .ring1 { width: 200px; height: 200px; }
  .ring2 { width: 162px; height: 162px; border-color: rgba(0,225,255,0.4); }
  #orb { width: 124px; height: 124px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #6ff4ff, #00b7d6 55%, #003a45 100%); box-shadow: 0 0 30px rgba(0,225,255,0.55), inset 0 0 25px rgba(255,255,255,0.25); }
  #orb.idle { opacity: 0.55; }
  #orb.listening { animation: pulse 1.1s ease-in-out infinite; }
  #orb.speaking { animation: speak 0.5s ease-in-out infinite alternate; box-shadow: 0 0 55px rgba(0,255,200,0.85), inset 0 0 25px rgba(255,255,255,0.4); }
  #orb.thinking { animation: pulse 0.6s ease-in-out infinite; box-shadow: 0 0 40px rgba(255,180,0,0.6); }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  @keyframes speak { from { transform: scale(1); } to { transform: scale(1.14); } }
  #youSaid { z-index: 2; max-width: 340px; text-align: center; color: #6ee3f5bb; font-size: 13px; line-height: 1.4; padding: 0 12px; min-height: 18px; }
  #cyberSaid { z-index: 2; max-width: 340px; text-align: center; color: #d8f9ff; font-size: 15px; line-height: 1.4; padding: 0 12px; min-height: 24px; font-weight: 500; }
  #nowPlaying { z-index: 2; font-size: 12px; color: #00ffc8aa; min-height: 16px; }
  footer { z-index: 2; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; padding-bottom: 10px; }
  #startBtn { background: transparent; border: 1px solid rgba(0,225,255,0.4); color: #6ee3f5; padding: 12px 32px; border-radius: 999px; font-size: 13px; letter-spacing: 1px; }
  #startBtn.active { border-color: #00ffc8; color: #00ffc8; }
  .row { display: flex; gap: 12px; }
  .iconBtn { width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(0,225,255,0.3); background: rgba(255,255,255,0.03); color: #6ee3f5; font-size: 18px; display: flex; align-items: center; justify-content: center; }
  .iconBtn.on { background: rgba(0,225,255,0.2); color: #fff; }
</style>
</head>
<body>
<div id="app">
  <video id="camFeed" autoplay playsinline muted></video>
  <div class="scrim"></div>
  <header>
    <h1>CYBER</h1>
    <div id="status">tap start — then just talk</div>
  </header>
  <main>
    <div class="orb-wrap">
      <div class="ring ring1"></div>
      <div class="ring ring2"></div>
      <div id="orb" class="idle"></div>
    </div>
    <div id="youSaid"></div>
    <div id="cyberSaid">Cyber is ready. Just speak naturally.</div>
    <div id="nowPlaying"></div>
  </main>
  <footer>
    <div class="row">
      <button class="iconBtn" id="camToggle">📷</button>
      <button class="iconBtn" id="muteToggle">🎤</button>
    </div>
    <button id="startBtn">START</button>
  </footer>
</div>

<audio id="musicPlayer" playsinline></audio>
<canvas id="captureCanvas" style="display:none;"></canvas>

<script>
const statusEl = document.getElementById("status");
const youSaidEl = document.getElementById("youSaid");
const cyberSaidEl = document.getElementById("cyberSaid");
const nowPlayingEl = document.getElementById("nowPlaying");
const orb = document.getElementById("orb");
const startBtn = document.getElementById("startBtn");
const camToggle = document.getElementById("camToggle");
const muteToggle = document.getElementById("muteToggle");
const camFeed = document.getElementById("camFeed");
const musicPlayer = document.getElementById("musicPlayer");
const captureCanvas = document.getElementById("captureCanvas");

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const SS = window.speechSynthesis;

let recognition = null;
let running = false;
let isSpeaking = false;
let isProcessing = false;
let micMuted = false;
let camOn = false;
let camStream = null;
let musicVolume = 70;
let conversation = [];
let silenceTimer = null;
let restartTimer = null;
let finalBuffer = "";

function setOrb(state) {
  orb.classList.remove("idle","listening","speaking","thinking");
  orb.classList.add(state);
}
function setStatus(t) { statusEl.textContent = t; }

// ------------------------------------------------------------
// Speech recognition — continuous, waits for you to finish
// ------------------------------------------------------------
if (SR) {
  recognition = new SR();
  recognition.lang = "en-US";
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onresult = (e) => {
    if (isSpeaking || isProcessing || micMuted) return;

    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        finalBuffer += e.results[i][0].transcript + " ";
      } else {
        interim += e.results[i][0].transcript;
      }
    }

    const display = (finalBuffer + interim).trim();
    if (display) youSaidEl.textContent = display;

    // Reset silence timer — fire when user stops talking for 900ms
    clearTimeout(silenceTimer);
    silenceTimer = setTimeout(() => {
      const text = finalBuffer.trim();
      finalBuffer = "";
      if (text) sendToCyber(text);
    }, 900);
  };

  recognition.onerror = (e) => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      setStatus("microphone permission denied");
      stopListening();
    }
    // other errors (no-speech, aborted) are transient — onend restarts
  };

  recognition.onend = () => {
    // Safari stops recognition on its own — restart immediately if still running
    if (running && !isSpeaking && !isProcessing) {
      clearTimeout(restartTimer);
      restartTimer = setTimeout(() => {
        try { recognition.start(); } catch(e) {}
      }, 150);
    }
  };
} else {
  startBtn.disabled = true;
  setStatus("speech recognition not supported in this browser");
}

// ------------------------------------------------------------
// Start / Stop
// ------------------------------------------------------------
function startListening() {
  running = true;
  finalBuffer = "";
  startBtn.textContent = "STOP";
  startBtn.classList.add("active");
  setOrb("listening");
  setStatus("listening...");
  try { recognition.start(); } catch(e) {}
  speakCyber("Cyber online. I'm listening.");
}

function stopListening() {
  running = false;
  clearTimeout(silenceTimer);
  clearTimeout(restartTimer);
  startBtn.textContent = "START";
  startBtn.classList.remove("active");
  setOrb("idle");
  setStatus("tap start — then just talk");
  SS.cancel();
  try { recognition.stop(); } catch(e) {}
}

startBtn.addEventListener("click", () => {
  running ? stopListening() : startListening();
});

// ------------------------------------------------------------
// Send to Cyber
// ------------------------------------------------------------
async function sendToCyber(text) {
  if (isProcessing) return;
  isProcessing = true;

  youSaidEl.textContent = text;
  cyberSaidEl.textContent = "";
  setOrb("thinking");
  setStatus("thinking...");

  try { recognition.stop(); } catch(e) {}

  conversation.push({ role: "user", content: text });

  try {
    const resp = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: conversation.slice(-14) }),
    });

    const data = await resp.json();

    if (!resp.ok) {
      cyberSaidEl.textContent = "Something went wrong. Try again.";
      isProcessing = false;
      resumeListening();
      return;
    }

    if (data.toolCalls?.length) {
      await handleToolCalls(data.toolCalls, data.assistantMessage);
    } else {
      conversation.push({ role: "assistant", content: data.reply });
      speakCyber(data.reply);
    }

  } catch(err) {
    console.error(err);
    cyberSaidEl.textContent = "Connection error.";
    isProcessing = false;
    resumeListening();
  }
}

// ------------------------------------------------------------
// Tool calls
// ------------------------------------------------------------
async function handleToolCalls(toolCalls, assistantMsg) {
  if (assistantMsg) {
    conversation.push({
      role: "assistant",
      content: assistantMsg.content || null,
      tool_calls: toolCalls.map((tc) => ({
        id: tc.id, type: "function",
        function: { name: tc.name, arguments: tc.arguments },
      })),
    });
  }

  for (const call of toolCalls) {
    let args = {};
    try { args = call.arguments ? JSON.parse(call.arguments) : {}; } catch(e) {}

    let result = {};
    switch(call.name) {
      case "play_music":     result = await playMusic(args.song_name); break;
      case "pause_music":    musicPlayer.pause(); result = { success: true, message: "Music paused." }; break;
      case "stop_music":     musicPlayer.pause(); musicPlayer.currentTime = 0; nowPlayingEl.textContent = ""; result = { success: true, message: "Music stopped." }; break;
      case "set_volume":     musicVolume = Math.max(0, Math.min(100, args.level ?? 70)); musicPlayer.volume = musicVolume / 100; result = { success: true, message: `Volume set to ${musicVolume}.` }; break;
      case "take_photo":     result = camOn ? { success: true, message: "Photo captured." } : { success: false, message: "Camera not active." }; break;
      case "analyze_camera": result = await visionRequest("describe"); break;
      case "identify_object":result = await visionRequest("object"); break;
      case "identify_money": result = await visionRequest("money"); break;
      default:               result = { success: false, message: "Unknown function." };
    }

    conversation.push({
      role: "tool",
      tool_call_id: call.id,
      content: JSON.stringify(result),
    });
  }

  // Get Cyber's spoken reply now that it has the results
  try {
    const resp = await fetch("/chat/continue", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: conversation.slice(-16) }),
    });

    const data = await resp.json();
    if (resp.ok && data.reply) {
      conversation.push({ role: "assistant", content: data.reply });
      speakCyber(data.reply);
    } else {
      isProcessing = false;
      resumeListening();
    }
  } catch(err) {
    console.error(err);
    isProcessing = false;
    resumeListening();
  }
}

// ------------------------------------------------------------
// Speak — pause mic while speaking, resume after
// ------------------------------------------------------------
function speakCyber(text) {
  if (!text) { isProcessing = false; resumeListening(); return; }

  cyberSaidEl.textContent = text;
  isSpeaking = true;
  setOrb("speaking");
  setStatus("speaking...");

  SS.cancel();

  // iOS Safari fix: short delay before speak, and keep synthesis alive
  setTimeout(() => {
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.0;
    u.pitch = 0.95;
    u.volume = 1.0;

    u.onend = () => {
      isSpeaking = false;
      isProcessing = false;
      resumeListening();
    };

    u.onerror = () => {
      isSpeaking = false;
      isProcessing = false;
      resumeListening();
    };

    SS.speak(u);
  }, 50);
}

function resumeListening() {
  if (!running) return;
  finalBuffer = "";
  setOrb("listening");
  setStatus("listening...");
  clearTimeout(restartTimer);
  restartTimer = setTimeout(() => {
    try { recognition.start(); } catch(e) {}
  }, 200);
}

// ------------------------------------------------------------
// Music
// ------------------------------------------------------------
async function playMusic(songName) {
  try {
    const { songs } = await fetch("/music/list").then(r => r.json());
    if (!songs?.length) return { success: false, message: "No songs in library." };

    let chosen = songs[0];
    if (songName) {
      const m = songs.find(s => s.toLowerCase().includes(songName.toLowerCase()));
      if (m) chosen = m;
    }

    musicPlayer.src = "/music/" + encodeURIComponent(chosen);
    musicPlayer.volume = musicVolume / 100;
    await musicPlayer.play();
    nowPlayingEl.textContent = "♪ " + chosen;
    return { success: true, message: `Now playing ${chosen}.` };
  } catch(e) {
    return { success: false, message: "Could not play music." };
  }
}

// ------------------------------------------------------------
// Vision
// ------------------------------------------------------------
async function visionRequest(mode) {
  if (!camOn || !camStream) {
    return { success: false, message: "Camera is not active. Tap the camera icon first." };
  }
  try {
    const track = camStream.getVideoTracks()[0];
    const s = track.getSettings();
    captureCanvas.width = s.width || 640;
    captureCanvas.height = s.height || 480;
    captureCanvas.getContext("2d").drawImage(camFeed, 0, 0, captureCanvas.width, captureCanvas.height);
    const base64 = captureCanvas.toDataURL("image/jpeg", 0.7).split(",")[1];

    const resp = await fetch("/vision", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: base64, mode }),
    });
    const data = await resp.json();
    if (!resp.ok) return { success: false, message: data.error || "Vision failed." };
    return { success: true, description: data.description };
  } catch(e) {
    return { success: false, message: "Could not analyze camera." };
  }
}

// ------------------------------------------------------------
// UI controls
// ------------------------------------------------------------
muteToggle.addEventListener("click", () => {
  micMuted = !micMuted;
  muteToggle.classList.toggle("on", micMuted);
  muteToggle.textContent = micMuted ? "🔇" : "🎤";
});

camToggle.addEventListener("click", async () => {
  if (camOn) {
    camStream.getTracks().forEach(t => t.stop());
    camFeed.srcObject = null;
    camOn = false;
    camToggle.classList.remove("on");
    return;
  }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    camFeed.srcObject = camStream;
    camOn = true;
    camToggle.classList.add("on");
  } catch(e) {
    setStatus("camera permission denied");
  }
});
</script>
</body>
</html>
