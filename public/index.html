<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>CYBER</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:#05070a;font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;overflow:hidden}
#app{position:relative;height:100dvh;width:100vw;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);background:radial-gradient(circle at 50% 20%,rgba(0,225,255,.10),transparent 60%),#05070a}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.28;z-index:0}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,10,.88) 0%,rgba(5,7,10,.50) 40%,rgba(5,7,10,.92) 100%);z-index:1}
header{z-index:2;text-align:center;padding-top:24px}
h1{margin:0;font-size:15px;letter-spacing:6px;font-weight:600;color:#00e1ff;text-shadow:0 0 18px rgba(0,225,255,.6)}
#status{margin-top:6px;font-size:12px;color:#6ee3f5aa;letter-spacing:1px;min-height:16px}
main{z-index:2;flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.orb-wrap{position:relative;width:200px;height:200px;display:flex;align-items:center;justify-content:center}
.ring{position:absolute;border-radius:50%;border:1px solid rgba(0,225,255,.22)}
.r1{width:200px;height:200px}
.r2{width:162px;height:162px;border-color:rgba(0,225,255,.38)}
#orb{width:124px;height:124px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6ff4ff,#00b7d6 55%,#003a45 100%);box-shadow:0 0 30px rgba(0,225,255,.55),inset 0 0 25px rgba(255,255,255,.25);transition:box-shadow .2s}
#orb.idle{opacity:.5}
#orb.listening{animation:pulse 1.2s ease-in-out infinite}
#orb.thinking{animation:pulse .65s ease-in-out infinite;box-shadow:0 0 40px rgba(255,180,0,.65)}
#orb.speaking{animation:speak .5s ease-in-out infinite alternate;box-shadow:0 0 55px rgba(0,255,200,.85),inset 0 0 25px rgba(255,255,255,.4)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes speak{from{transform:scale(1)}to{transform:scale(1.13)}}
#youSaid{z-index:2;max-width:340px;text-align:center;color:#6ee3f5bb;font-size:13px;line-height:1.4;min-height:18px;padding:0 12px}
#cyberSaid{z-index:2;max-width:340px;text-align:center;color:#d8f9ff;font-size:15px;line-height:1.5;min-height:24px;font-weight:500;padding:0 12px}
#nowPlaying{z-index:2;font-size:12px;color:#00ffc8aa;min-height:16px}
footer{z-index:2;width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding-bottom:10px}
#startBtn{background:transparent;border:1px solid rgba(0,225,255,.4);color:#6ee3f5;padding:12px 32px;border-radius:999px;font-size:13px;letter-spacing:1px;min-width:140px}
#startBtn.on{border-color:#00ffc8;color:#00ffc8}
.row{display:flex;gap:12px}
.icon{width:46px;height:46px;border-radius:50%;border:1px solid rgba(0,225,255,.28);background:rgba(255,255,255,.03);color:#6ee3f5;font-size:18px;display:flex;align-items:center;justify-content:center}
.icon.on{background:rgba(0,225,255,.18);color:#fff}
</style>
</head>
<body>
<div id="app">
  <video id="cam" autoplay playsinline muted></video>
  <div class="scrim"></div>
  <header>
    <h1>CYBER</h1>
    <div id="status">tap start — then speak naturally</div>
  </header>
  <main>
    <div class="orb-wrap">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div id="orb" class="idle"></div>
    </div>
    <div id="youSaid"></div>
    <div id="cyberSaid">Cyber is ready.</div>
    <div id="nowPlaying"></div>
  </main>
  <footer>
    <div class="row">
      <button class="icon" id="camBtn">📷</button>
      <button class="icon" id="muteBtn">🎤</button>
    </div>
    <button id="startBtn">START</button>
  </footer>
</div>

<audio id="music" playsinline></audio>
<canvas id="canvas" style="display:none"></canvas>

<script>
// ── elements
const $status  = document.getElementById("status");
const $you     = document.getElementById("youSaid");
const $cyber   = document.getElementById("cyberSaid");
const $playing = document.getElementById("nowPlaying");
const $orb     = document.getElementById("orb");
const $start   = document.getElementById("startBtn");
const $cam     = document.getElementById("camBtn");
const $mute    = document.getElementById("muteBtn");
const $video   = document.getElementById("cam");
const $music   = document.getElementById("music");
const $canvas  = document.getElementById("canvas");

// ── state
let running=false, speaking=false, processing=false, muted=false;
let camOn=false, camStream=null, vol=70;
let conversation=[], silTimer=null, rstTimer=null, finalBuf="";

// ── speech engine
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const SS = window.speechSynthesis;
let rec = null;

function orb(s){ $orb.className = s; }
function status(t){ $status.textContent = t; }

if(!SR){
  $start.disabled = true;
  status("speech not supported in this browser");
} else {
  rec = new SR();
  rec.lang = "en-US";
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 1;

  rec.onresult = e => {
    if(speaking || processing || muted) return;
    let interim = "";
    for(let i = e.resultIndex; i < e.results.length; i++){
      if(e.results[i].isFinal) finalBuf += e.results[i][0].transcript + " ";
      else interim += e.results[i][0].transcript;
    }
    const show = (finalBuf + interim).trim();
    if(show) $you.textContent = show;

    // restart silence window every time new speech arrives
    clearTimeout(silTimer);
    silTimer = setTimeout(() => {
      const text = finalBuf.trim();
      finalBuf = "";
      if(text) chat(text);
    }, 950);
  };

  rec.onerror = e => {
    if(e.error === "not-allowed" || e.error === "service-not-allowed"){
      status("microphone permission denied");
      stop();
    }
    // transient errors handled by onend restart
  };

  rec.onend = () => {
    if(running && !speaking && !processing){
      clearTimeout(rstTimer);
      rstTimer = setTimeout(() => { try{ rec.start(); }catch(e){} }, 120);
    }
  };
}

// ── start / stop
function start(){
  running = true; finalBuf = "";
  $start.textContent = "STOP"; $start.classList.add("on");
  orb("listening"); status("listening...");
  try{ rec.start(); }catch(e){}
  say("Cyber online. I'm listening.");
}
function stop(){
  running = false;
  clearTimeout(silTimer); clearTimeout(rstTimer);
  $start.textContent = "START"; $start.classList.remove("on");
  orb("idle"); status("tap start — then speak naturally");
  SS.cancel(); try{ rec.stop(); }catch(e){}
}
$start.addEventListener("click", () => running ? stop() : start());

// ── chat
async function chat(text){
  if(processing) return;
  processing = true;
  $you.textContent = text; $cyber.textContent = "";
  orb("thinking"); status("thinking...");
  try{ rec.stop(); }catch(e){}

  conversation.push({ role:"user", content:text });

  try{
    const r = await fetch("/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ messages: conversation.slice(-14) }),
    });
    const d = await r.json();
    if(!r.ok){ say("Something went wrong, try again."); return; }

    if(d.toolCalls?.length){
      await runTools(d.toolCalls, d.assistantMessage);
    } else {
      conversation.push({ role:"assistant", content:d.reply });
      say(d.reply);
    }
  } catch(e){
    console.error(e);
    say("Connection error.");
  }
}

// ── tool execution
async function runTools(calls, aMsg){
  if(aMsg){
    conversation.push({
      role:"assistant", content: aMsg.content || null,
      tool_calls: calls.map(c=>({ id:c.id, type:"function", function:{name:c.name,arguments:c.arguments} })),
    });
  }

  for(const c of calls){
    let args={};
    try{ args = c.arguments ? JSON.parse(c.arguments) : {}; }catch(e){}
    let res={};

    switch(c.name){
      case "play_music":     res = await playMusic(args.song_name); break;
      case "pause_music":    $music.pause(); res={success:true,message:"Paused."}; break;
      case "stop_music":     $music.pause(); $music.currentTime=0; $playing.textContent=""; res={success:true,message:"Stopped."}; break;
      case "set_volume":     vol=Math.max(0,Math.min(100,args.level??70)); $music.volume=vol/100; res={success:true,message:`Volume ${vol}.`}; break;
      case "analyze_camera": res = await vision("describe"); break;
      case "identify_object":res = await vision("object"); break;
      case "identify_money": res = await vision("money"); break;
      default:               res = {success:false,message:"Unknown function."};
    }

    conversation.push({ role:"tool", tool_call_id:c.id, content:JSON.stringify(res) });
  }

  try{
    const r = await fetch("/chat/continue",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ messages: conversation.slice(-16) }),
    });
    const d = await r.json();
    if(r.ok && d.reply){
      conversation.push({ role:"assistant", content:d.reply });
      say(d.reply);
    } else { resume(); }
  } catch(e){ console.error(e); resume(); }
}

// ── speak — pause mic while Cyber talks, resume after
function say(text){
  if(!text){ processing=false; resume(); return; }
  $cyber.textContent = text;
  speaking = true; orb("speaking"); status("speaking...");
  SS.cancel();
  setTimeout(() => {
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.0; u.pitch = 0.95; u.volume = 1.0;
    u.onend  = done;
    u.onerror= done;
    SS.speak(u);
    // iOS Safari sometimes silently drops utterances — keep synthesis alive
    const ping = setInterval(() => { if(!SS.speaking) clearInterval(ping); else SS.resume(); }, 8000);
    u.onend = () => { clearInterval(ping); done(); };
  }, 60);
}
function done(){ speaking=false; processing=false; resume(); }
function resume(){
  if(!running) return;
  finalBuf = ""; orb("listening"); status("listening...");
  clearTimeout(rstTimer);
  rstTimer = setTimeout(() => { try{ rec.start(); }catch(e){} }, 180);
}

// ── music
async function playMusic(name){
  try{
    const {songs} = await fetch("/music/list").then(r=>r.json());
    if(!songs?.length) return {success:false,message:"No songs in library."};
    let pick = songs[0];
    if(name){ const m=songs.find(s=>s.toLowerCase().includes(name.toLowerCase())); if(m) pick=m; }
    $music.src = "/music/" + encodeURIComponent(pick);
    $music.volume = vol/100;
    await $music.play();
    $playing.textContent = "♪ " + pick;
    return {success:true,message:`Playing ${pick}.`};
  } catch(e){ return {success:false,message:"Could not play music."}; }
}

// ── vision
async function vision(mode){
  if(!camOn||!camStream) return {success:false,message:"Camera not active. Tap the camera icon first."};
  try{
    const t=camStream.getVideoTracks()[0], s=t.getSettings();
    $canvas.width=s.width||640; $canvas.height=s.height||480;
    $canvas.getContext("2d").drawImage($video,0,0,$canvas.width,$canvas.height);
    const b64=$canvas.toDataURL("image/jpeg",.72).split(",")[1];
    const r=await fetch("/vision",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:b64,mode})});
    const d=await r.json();
    if(!r.ok) return {success:false,message:d.error||"Vision failed."};
    return {success:true,description:d.description};
  } catch(e){ return {success:false,message:"Camera analysis failed."}; }
}

// ── camera toggle
$cam.addEventListener("click", async () => {
  if(camOn){ camStream.getTracks().forEach(t=>t.stop()); $video.srcObject=null; camOn=false; $cam.classList.remove("on"); return; }
  try{
    camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    $video.srcObject=camStream; camOn=true; $cam.classList.add("on");
  } catch(e){ status("camera permission denied"); }
});

// ── mute toggle
$mute.addEventListener("click", () => {
  muted=!muted; $mute.classList.toggle("on",muted); $mute.textContent=muted?"🔇":"🎤";
});

// ── pre-warm browser speech engine so first utterance isn't silent on iOS
window.addEventListener("click", () => {
  if(SS && !SS.speaking){ const u=new SpeechSynthesisUtterance(""); SS.speak(u); }
}, { once:true });
</script>
</body>
</html>
